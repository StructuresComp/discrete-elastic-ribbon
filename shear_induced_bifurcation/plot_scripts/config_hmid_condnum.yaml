# Config for plot_hmid_condnum.py: |H_mid|/L and condition number vs ΔW/L.
# Single energy model, 4 pkls -> 4 subplots (2x2).
#
# For each subplot:
#   pkl: path to pkl (relative to base_dir or absolute). Must contain condition_numbers
#        (run simulate_track.py with --track-all).
#   subplot_title: W/L subtitle (e.g. "W/L = 1/6")
#   increasing: true  -> plot ΔW increasing branch (phase 3)
#               false -> plot ΔW decreasing branch (phase 4)
#   ylim_condnum: optional [min, max] for right axis (condition number) for this subplot only.
#                If omitted, the global ylim_condnum below is used; if that is null, limits are auto.
#
# cond_scale: "log" (default) or "linear" for the condition number axis.
# Axis limits: xlim, ylim (left = |H_mid|/L). Global ylim_condnum = default for all subplots (null = auto).

base_dir: ".."
cond_scale: log   # log or linear for right axis

# Figure
title: "Sano — |H_mid|/L and Condition Number"
figsize: [16, 10]
wspace: 0.28
hspace: 0.35
tight_layout_rect: [0, 0, 1, 0.82]

# Axis limits (all subplots)
xlim: [0, 0.5]
ylim: [-0.05, 0.35]        # left axis: |H_mid|/L
ylim_condnum: null          # right axis: condition number; null = auto per subplot

# Single energy: 4 entries, one per subplot (order: top-left, top-right, bottom-left, bottom-right).
energy: sano
subplots:
  - pkl: "results_bc1_he1-3/sano_Ye10d1e3/1b2_n63.pkl"
    subplot_title: "W/L = 1/2"
    increasing: false
    ylim_condnum: null
  - pkl: "results_bc1_he1-3/sano_Ye10d1e3/1b6_n63.pkl"
    subplot_title: "W/L = 1/6"
    increasing: false
    ylim_condnum: null
  - pkl: "results_bc1_he1-3/sano_Ye10d1e3/1b12_n63.pkl"
    subplot_title: "W/L = 1/12"
    increasing: false
    ylim_condnum: null
  - pkl: "results_bc1_he1-3/sano_Ye10d1e3/1b20_n45.pkl"
    subplot_title: "W/L = 1/20"
    increasing: false
    ylim_condnum: null
